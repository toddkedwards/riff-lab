<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Riff Lab — teaser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/4.2.2/vexflow-min.js"></script>
<style>
  :root{ --accent:#ff5a1f; --ink:#f3f5f8; --muted:#7f8a99; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#07090c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
  .hold{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:#07090c}
  .stage{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;background:radial-gradient(120% 120% at 50% 30%,#12161c 0%,#07090c 70%);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(12px);transition:opacity .7s ease, transform .9s cubic-bezier(.2,.75,.2,1);padding:6% 8%}
  .scene.on{opacity:1;transform:translateY(0)}
  .big{font-size:clamp(24px,5.4vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .big .a{color:var(--accent)}
  .sub{font-size:clamp(12px,1.7vw,17px);color:var(--muted);margin-top:14px;letter-spacing:.02em}
  .string{position:absolute;left:50%;top:12%;bottom:12%;width:2px;background:linear-gradient(#ff5a1f00,var(--accent),#ff5a1f00);transform:translateX(-50%) scaleY(0);transform-origin:center;transition:transform 1s cubic-bezier(.2,.8,.2,1);opacity:.9}
  .string.on{transform:translateX(-50%) scaleY(1)}

  .paper{background:#fbfbf9;border-radius:12px;padding:6px 10px;box-shadow:0 18px 50px rgba(0,0,0,.5);width:min(78%,640px)}
  .paper svg{display:block;margin:0 auto;width:100%;height:auto}
  .reveal{clip-path:inset(0 100% 0 0);transition:clip-path 1.5s cubic-bezier(.35,.6,.2,1)}
  .reveal.on{clip-path:inset(0 0 0 0)}
  .keyline{margin-top:22px;font-size:clamp(20px,3.6vw,34px);font-weight:800;opacity:0;transform:scale(.96);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
  .keyline.on{opacity:1;transform:scale(1)}
  .keyline .a{color:var(--accent)}

  #fret{width:min(84%,720px)}
  #fret svg{width:100%;height:auto;display:block}
  .fdot{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2)}
  .fdot.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes pop{to{opacity:1;transform:scale(1)}}

  .flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s ease}
  .flash.on{opacity:1}
  .flash span{font-size:clamp(30px,7vw,74px);font-weight:800;letter-spacing:-.02em}
  .flash .a{color:var(--accent)}

  .wm{font-size:clamp(34px,8vw,84px);font-weight:800;letter-spacing:-.02em;opacity:0;transform:scale(.9);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
  .wm.on{opacity:1;transform:scale(1)}
  .wm b{color:var(--accent)}
  .tagl{margin-top:16px;font-size:clamp(13px,2vw,20px);color:var(--muted);letter-spacing:.04em;opacity:0;transition:opacity .8s ease .2s}
  .tagl.on{opacity:1}
  .url{margin-top:8px;font-size:clamp(12px,1.6vw,16px);color:var(--accent);font-weight:600;letter-spacing:.03em;opacity:0;transition:opacity .8s ease .5s}
  .url.on{opacity:1}

  .replay{position:absolute;right:14px;bottom:12px;background:rgba(255,255,255,.08);color:#cfd6df;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:7px 14px;font:600 12px inherit;cursor:pointer;opacity:0;transition:opacity .5s}
  .replay.on{opacity:1}
  .vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(0,0,0,.55);border-radius:14px}
</style>
</head>
<body>
<div class="hold">
  <div class="stage" id="stage">
    <div class="string" id="s0"></div>

    <div class="scene" id="s1"><div class="big">You can play.</div></div>
    <div class="scene" id="s2"><div class="big">But do you <span class="a">know what you're playing?</span></div></div>

    <div class="scene" id="s3">
      <div class="paper reveal" id="paperWrap"><div id="staff"></div></div>
      <div class="keyline" id="keyline">That's <span class="a">G minor pentatonic</span></div>
    </div>

    <div class="scene" id="s4">
      <div id="fret"></div>
      <div class="sub" id="fretSub" style="margin-top:18px">see it on the neck</div>
    </div>

    <div class="flash" id="f1"><span>Jam <span class="a">with it.</span></span></div>
    <div class="flash" id="f2"><span>Name any <span class="a">chord.</span></span></div>
    <div class="flash" id="f3"><span>Learn the <span class="a">fretboard.</span></span></div>
    <div class="flash" id="f4"><span>Ask <span class="a">why</span> it works.</span></div>

    <div class="scene" id="s6">
      <div class="wm" id="wm">Riff<b>Lab</b></div>
      <div class="tagl" id="tagl">hear it. read it. keep it.</div>
      <div class="url" id="url">rifflab.blackbeaconstudios.net</div>
    </div>

    <div class="vig"></div>
    <button class="replay" id="replay">↻ Replay</button>
  </div>
</div>

<script>
// notation
function drawStaff(){
  if(!window.Vex) return; const VF=Vex.Flow; const div=document.getElementById('staff'); div.innerHTML='';
  const mids=[55,58,60,62,65,62,60]; const W=560;
  const r=new VF.Renderer(div,VF.Renderer.Backends.SVG); r.resize(W,120); const ctx=r.getContext();
  const st=new VF.Stave(6,6,W-12); st.addClef('treble').addTimeSignature('4/4'); st.setContext(ctx).draw();
  const nn=['c','c#','d','d#','e','f','f#','g','g#','a','a#','b'];
  const v=new VF.Voice({num_beats:4,beat_value:4}).setStrict(false);
  v.addTickables(mids.map(m=>new VF.StaveNote({keys:[nn[m%12]+'/'+(Math.floor(m/12)-1)],duration:'8'})));
  try{ VF.Accidental.applyAccidentals([v],'C'); }catch(e){}
  new VF.Formatter().joinVoices([v]).format([v],W-70); v.draw(ctx,st);
}
// fretboard (G minor pentatonic, orange dots)
function drawFret(){
  const host=document.getElementById('fret'); const open=[40,45,50,55,59,64]; const scale=new Set([7,10,0,2,5]);
  const NF=12,padL=30,padT=8,fw=44,sh=26,W=padL+NF*fw+14,H=padT+6*sh+16,rows=[5,4,3,2,1,0];
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let f=0;f<=NF;f++){ const x=padL+f*fw,nut=f===0; s+=`<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+6*sh}" stroke="${nut?'#cfd6df':'#2b323c'}" stroke-width="${nut?3:1.3}"/>`; }
  rows.forEach((si,ri)=>{ const y=padT+ri*sh+sh/2; s+=`<line x1="${padL}" y1="${y}" x2="${padL+NF*fw}" y2="${y}" stroke="#3a4250" stroke-width="${(1+(5-si)*.3).toFixed(2)}"/>`; });
  let i=0;
  rows.forEach((si)=>{ const y=padT+ (rows.indexOf(si))*sh+sh/2;
    for(let f=1;f<=NF;f++){ const pc=((open[si]+f)%12+12)%12; if(!scale.has(pc)) continue; const x=padL+(f-.5)*fw; const root=pc===7;
      s+=`<circle class="fdot" data-i="${i++}" cx="${x}" cy="${y}" r="8.5" fill="${root?'#ff5a1f':'#20262f'}" stroke="${root?'#ff5a1f':'#3f4753'}"/>`;
    }
  });
  host.innerHTML=s+`</svg>`;
}

const T=(el,cls,on)=>{ const e=typeof el==='string'?document.getElementById(el):el; if(e) e.classList[on?'add':'remove'](cls); };
let timers=[];
function at(t,fn){ timers.push(setTimeout(fn,t)); }
function run(){
  timers.forEach(clearTimeout); timers=[];
  ['s1','s2','s3','s4','s6'].forEach(id=>T(id,'on',false));
  ['f1','f2','f3','f4'].forEach(id=>T(id,'on',false));
  T('s0','on',false); T('paperWrap','on',false); T('keyline','on',false); T('wm','on',false); T('tagl','on',false); T('url','on',false); T('replay','on',false);
  document.querySelectorAll('.fdot').forEach(d=>d.classList.remove('pop'));

  at(200,()=>T('s0','on',true));
  at(700,()=>T('s1','on',true));
  at(2400,()=>{ T('s1','on',false); T('s0','on',false); });
  at(2700,()=>T('s2','on',true));
  at(4500,()=>T('s2','on',false));

  at(4900,()=>{ T('s3','on',true); });
  at(5300,()=>T('paperWrap','on',true));   // notation "writes" in
  at(7400,()=>T('keyline','on',true));      // the key names itself
  at(9600,()=>T('s3','on',false));

  at(10000,()=>{ T('s4','on',true); document.querySelectorAll('.fdot').forEach((d,k)=>{ d.style.animationDelay=(k*45)+'ms'; d.classList.add('pop'); }); });
  at(12600,()=>T('s4','on',false));

  const flashes=[['f1',12900],['f2',13500],['f3',14100],['f4',14700]];
  flashes.forEach(([id,t])=>{ at(t,()=>T(id,'on',true)); at(t+520,()=>T(id,'on',false)); });

  at(15500,()=>T('s6','on',true));
  at(15700,()=>T('wm','on',true));
  at(16300,()=>T('tagl','on',true));
  at(16800,()=>T('url','on',true));
  at(18600,()=>T('replay','on',true));
}
window.addEventListener('load',()=>{ try{ drawStaff(); }catch(e){} drawFret(); run(); });
document.getElementById('replay').onclick=run;
</script>
</body>
</html>
